name: voyagooo
description: Voyago - AI-powered travel itinerary app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.2.5
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  uuid: ^4.3.3
  http: ^1.2.0
  weather_animation: ^1.2.0
  confetti: ^0.8.0
  video_player: ^2.10.1
  flutter_map_location_marker: ^9.1.1
  geolocator: ^13.0.2
  flutter_map_animations: ^0.8.0
  image_picker: ^1.2.2
  country_state_city: ^0.1.6
  crystal_navigation_bar: ^1.1.0
  sizer: ^3.1.3
  flutter_earth_globe: ^2.2.1
  animated_text_kit: ^4.3.0
  emoji_picker_flutter: ^4.4.0
  animated_emoji: ^3.2.1
  custom_rating_bar: ^3.0.0
  rate_my_app: ^2.3.2
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  pdf: ">=3.12.0 <3.13.0"
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  webview_flutter: ^4.13.1
  audioplayers: ">=6.7.1 <6.8.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo/
    - assets/medias/
    - assets/globe/
    - assets/icons3d/
    - assets/sounds/
